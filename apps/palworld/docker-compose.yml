services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    x-runtipi:
      is_main: true
      internal_port: 8211
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=8211
      - PLAYERS=32
      - MULTITHREADING=true
      - RCON_ENABLED=true
      - RCON_PORT=25575
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/palworld/
x-runtipi:
  schema_version: 2